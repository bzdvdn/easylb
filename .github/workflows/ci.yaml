name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          files="$(gofmt -l cmd internal api)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        uses: securego/gosec@v2.30.0
        with:
          args: -severity medium -confidence medium -exclude-generated ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint charts/easylb

      - name: render with example values
        run: |
          helm template easylb charts/easylb \
            --namespace easylb-system \
            -f charts/easylb/values-example.yaml \
            --include-crds > /tmp/rendered.yaml

      - name: render with Gateway API enabled
        run: |
          helm template easylb charts/easylb \
            --namespace easylb-system \
            --set gatewayAPI.enabled=true \
            --set speaker.enabled=true > /tmp/gateway.yaml

      - name: render examples
        run: |
          for values in examples/*/values.yaml; do
            [ -f "$values" ] || continue
            echo "rendering $values"
            helm template easylb charts/easylb \
              --namespace easylb-system \
              -f "$values" >/dev/null
          done

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: easylb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
