name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example, v0.1.0)
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: azure/setup-helm@v5

      - name: Check tag matches chart version and appVersion
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          chart="$(helm show chart charts/easylb)"
          version="$(printf '%s\n' "$chart" | awk '/^version:/ {print $2}')"
          app_version="$(printf '%s\n' "$chart" | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')"
          if [ "$tag" != "$version" ] || [ "$tag" != "$app_version" ]; then
            echo "tag $RELEASE_TAG must match chart version ($version) and appVersion ($app_version)"
            exit 1
          fi

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/easylb --destination dist

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm push dist/easylb-*.tgz "oci://ghcr.io/${owner}/charts"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.tgz
