apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vippools.easylb.io
spec:
  group: easylb.io
  scope: Cluster
  names:
    kind: VIPPool
    listKind: VIPPoolList
    plural: vippools
    singular: vippool
    shortNames:
    - vippool
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Addresses
      type: string
      jsonPath: .spec.addresses
    - name: AutoAssign
      type: boolean
      jsonPath: .spec.autoAssign
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - addresses
            properties:
              addresses:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
              autoAssign:
                type: boolean
