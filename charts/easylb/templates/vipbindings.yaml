{{- if .Values.bindings }}
{{- range $name, $binding := .Values.bindings }}
---
apiVersion: easylb.io/v1alpha1
kind: VIPBinding
metadata:
  name: {{ $name }}
  namespace: {{ required (printf "bindings.%s.namespace is required" $name) $binding.namespace }}
  labels:
    {{- include "easylb.labels" $ | nindent 4 }}
spec:
  serviceRef:
    name: {{ required (printf "bindings.%s.serviceRef is required" $name) $binding.serviceRef }}
  mode: {{ default "external" $binding.mode }}
  {{- if $binding.vips }}
  vips:
    {{- toYaml $binding.vips | nindent 4 }}
  {{- end }}
  {{- if $binding.poolRef }}
  poolRef:
    name: {{ $binding.poolRef }}
  {{- end }}
  {{- if $binding.requestedIP }}
  requestedIP: {{ $binding.requestedIP }}
  {{- end }}
  {{- if $binding.sharingKey }}
  sharingKey: {{ $binding.sharingKey }}
  {{- end }}
{{- end }}
{{- end }}
