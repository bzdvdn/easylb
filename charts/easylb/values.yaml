nameOverride: ""
fullnameOverride: ""

controller:
  enabled: true

  # Released images are published to ghcr.io/<owner>/<repo> by the release
  # workflow. Override repository/tag for forks, private registries, or local
  # builds. An empty tag uses Chart.appVersion.
  image:
    repository: ghcr.io/bzdvdn/easylb
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Keep leaderElect=true when replicas > 1.
  replicas: 2
  leaderElect: true
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s

  loadBalancerClass: easylb.io/easylb
  requireClass: false
  publishNodeIPs: true
  nodeIPTypes: InternalIP
  # Create VIPBinding objects automatically for LoadBalancer Services that
  # match a VIPPool with autoAssign enabled. Manual/Gateway bindings win.
  autoAssignServices: true
  requeueAfter: 5m

  priorityClassName: system-cluster-critical
  podAnnotations: {}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  topologySpreadConstraints: []

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  pdb:
    enabled: true
    minAvailable: 1

speaker:
  enabled: true

  # Uses the same image and release tag as the controller.
  image:
    repository: ghcr.io/bzdvdn/easylb
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Empty means auto-detect from the node IP (nodeIPType).
  interface: ""
  nodeIPType: InternalIP

  loadBalancerClass: easylb.io/easylb
  requireClass: false

  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s
  requeueAfter: 30s

  priorityClassName: system-node-critical
  podAnnotations: {}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists

  # The speaker opens AF_PACKET sockets. Non-root containers do not get an
  # effective NET_RAW capability with the default runtime, so the speaker runs
  # as root. It still drops all other capabilities and uses NET_RAW only.
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      add: ["NET_RAW"]
      drop: ["ALL"]

  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi

metrics:
  service:
    enabled: true
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

gatewayAPI:
  # Optional Gateway API -> VIPBinding integration.
  # Requires the Gateway API v1 CRDs (gateway.networking.k8s.io/v1).
  enabled: false

# Address pools. Example:
#
# pools:
#   ingress-vips:
#     addresses:
#       - 192.168.56.240-192.168.56.249
#     autoAssign: true
#     avoidBuggyIPs: true
#     mode: l2
#     serviceAllocation:
#       namespaceSelector:
#         matchLabels:
#           kubernetes.io/metadata.name: ingress-nginx
#       serviceSelector:
#         matchLabels:
#           app.kubernetes.io/name: ingress-nginx
pools: {}

# VIP bindings. Example:
#
# bindings:
#   ingress-keepalived:
#     namespace: ingress-nginx
#     serviceRef: my-release-ingress-nginx-controller
#     mode: external
#     vips:
#       - 192.168.56.250
#   ingress-easylb:
#     namespace: ingress-nginx
#     serviceRef: my-release-ingress-nginx-controller
#     mode: l2
#     poolRef: ingress-vips
#
# Each binding supports:
#   namespace, serviceRef, mode, vips, poolRef, requestedIP, sharingKey
bindings: {}
