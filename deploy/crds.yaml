---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vippools.easylb.io
spec:
  group: easylb.io
  scope: Cluster
  names:
    kind: VIPPool
    listKind: VIPPoolList
    plural: vippools
    singular: vippool
    shortNames:
      - vippool
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Addresses
          type: string
          jsonPath: .spec.addresses
        - name: AutoAssign
          type: boolean
          jsonPath: .spec.autoAssign
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - addresses
              properties:
                addresses:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                autoAssign:
                  type: boolean
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vipbindings.easylb.io
spec:
  group: easylb.io
  scope: Namespaced
  names:
    kind: VIPBinding
    listKind: VIPBindingList
    plural: vipbindings
    singular: vipbinding
    shortNames:
      - vipb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.serviceRef.name
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: VIPs
          type: string
          jsonPath: .status.allocatedIPs
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - serviceRef
              properties:
                serviceRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                mode:
                  type: string
                  enum:
                    - external
                    - l2
                    - bgp
                  default: external
                vips:
                  type: array
                  items:
                    type: string
                    minLength: 1
                poolRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                requestedIP:
                  type: string
            status:
              type: object
              properties:
                allocatedIPs:
                  type: array
                  items:
                    type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      type:
                        type: string
