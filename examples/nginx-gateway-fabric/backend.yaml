apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: gateway-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: nginxdemos/hello:plain-text
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: gateway-system
spec:
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: http
